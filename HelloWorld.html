<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f1f8;
      color: #2b1740;
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      color: #fff;
      background: #4e1a63;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #6a2587;
    }

    #mensagem {
      min-height: 1.5em;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <button id="btn-ola" type="button">Dizer olá</button>
  <p id="mensagem"></p>

  <script>
    // Captura o botão e exibe a mensagem ao clicar
    const botao = document.querySelector('#btn-ola');
    const mensagem = document.querySelector('#mensagem');

    botao.addEventListener('click', () => {
      mensagem.textContent = 'Olá! Este é o meu primeiro repositório da disciplina.';
    });
  </script>
</body>
</html>
